name: Run Tasks                       #WORKFLOW: name in actins tab

on: [push]                            #EVENT: run on every push

jobs:                                 #JOB:
  test:                               #JOB: 
    runs-on: ubuntu-latest            #RUNNER:
    steps:                            #STEP: 
      - uses: actions/checkout@v4     #STEP 1: grab code
      - uses: actions/setup-python@v5 #STEP 2: install Python
        with:
          python-version: "3.11"      # specifically this version
      - run: pip install pytest       #STEP 3: install pytest
      - run: pytest                   #STEP 4: run tests
